<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <div class="calculator-container">
      <h1>calc</h1>

      <div class="calculator-display">
          <p class="display-history">History</p>
          <p class="display-content">0<p>
      </div>

      <div class="button-container">
        <div class="calculator-buttons">
          <button aria-label="7" type="button" data-number="7">7</button>
          <button aria-label="8" type="button" data-number="8">8</button>
          <button aria-label="9" type="button" data-number="9">9</button>
          <button aria-label="x" type="button" data-operator="multiply">x</button>

          <button aria-label="4" type="button" data-number="4">4</button>
          <button aria-label="5" type="button" data-number="5">5</button>
          <button aria-label="6" type="button" data-number="6">6</button>
          <button aria-label="/" type="button" data-operator="divide">/</button>

          <button aria-label="1" type="button" data-number="1">1</button>
          <button aria-label="2" type="button" data-number="2">2</button>
          <button aria-label="3" type="button" data-number="3">3</button>
          <button aria-label="+" type="button" data-operator="plus">+</button>

          <button aria-label="." type="button" data-symbol="decimal-point">.</button>
          <button aria-label="0" type="button" data-number="0">0</button>
          <button aria-label="C" type="button" data-operator="clear">C</button>
          <button aria-label="-" type="button" data-operator="minus">-</button>
          
          <button aria-label="AC" type="button" data-operator="clear-all">AC</button>
          <button aria-label="=" type="button" data-operator="equals">=</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p>&copy; 2025 <a href="https://github.com/GarbanzoBeanz" target="_blank">GarbanzoBeanz</a>. All rights reserved.</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>
</html>
